# Generated by `pnpm openapi` from the api route table. Do not edit.
# @req FR:api/docs.openapi
openapi: 3.0.3
info:
  title: Stack API
  version: 0.0.1
  description: REST over the Stack core. JSON only, compact responses. Use `fields` to cut tokens. Tasks are addressed by `ref` = `project:line`. Authentication is supplied by the host (the handler denies every request when no authorize hook is configured).
servers:
  - url: /api
security:
  - host: []
paths:
  /next:
    get:
      summary: Top-ranked task
      operationId: next
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: "`task` is null when nothing is active."
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    allOf:
                      - $ref: "#/components/schemas/NextTask"
                    nullable: true
        default:
          $ref: "#/components/responses/Error"
  /tasks:
    get:
      summary: List tasks
      operationId: listTasks
      parameters:
        - name: project
          in: query
          schema:
            type: string
        - name: section
          in: query
          schema:
            type: string
          description: Section heading text, emoji ignored
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - done
              - all
            default: open
        - name: q
          in: query
          schema:
            type: string
          description: Case-insensitive text match
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Page of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a task
      operationId: addTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - project
                - text
              properties:
                project:
                  type: string
                  maxLength: 200
                  description: File base name, title, or alias Single line.
                text:
                  type: string
                  maxLength: 2000
                  description: One line; cannot contain the 🤖 autonomy marker (only the owner sets autonomy) Single line.
                section:
                  type: string
                  maxLength: 200
                  description: Default Active Single line.
                parent:
                  $ref: "#/components/schemas/Ref"
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current parent row text; 409 conflict when the parent row differs (stale line number) Single line.
      responses:
        "201":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{ref}:
    get:
      summary: Get one task
      operationId: getTask
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Ref"
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"
  /capture:
    post:
      summary: Add a task from a natural-language or speech phrase
      operationId: captureTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 2000
                  description: 'Phrase such as "call dentist tomorrow 30m #alpha" Single line.'
                project:
                  type: string
                  maxLength: 200
                  description: "Used when the text has no #project or @project hint Single line."
                section:
                  type: string
                  maxLength: 200
                  description: Default Active Single line.
                dryRun:
                  type: boolean
                  description: Parse and render without writing (200)
      responses:
        "200":
          description: Dry run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"
        "201":
          description: Task added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"
        default:
          $ref: "#/components/responses/Error"
  /tasks/start:
    post:
      summary: "Start a task (ref omitted means the next task). Tokens: ref required, autonomy assist or higher; 403 otherwise"
      operationId: startTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/complete:
    post:
      summary: "Complete a task. Tokens: ref required; autonomy assist for a 🪄 subtask, full otherwise (403 when unset); remove is owner-only; 409 with an open 🙋 child"
      operationId: completeTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                summary:
                  type: string
                  maxLength: 10000
                  description: Single line.
                remove:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/skip:
    post:
      summary: Skip (park) a task. Owner session only (403 for tokens)
      operationId: skipTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/resume:
    post:
      summary: Resume a parked task. Owner session only (403 for tokens)
      operationId: resumeTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/suspend:
    post:
      summary: Suspend a task for days or hours. Owner session only (403 for tokens)
      operationId: suspendTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
                hours:
                  type: integer
                  minimum: 1
                  maximum: 8760
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/set:
    post:
      summary: "Set task properties. Tokens: ref required; autonomy triage (priority, effort, impact), assist (status), fills missing priority/effort/impact only; checkbox, clearEmojis, and gate marks are owner-only (403)"
      operationId: setTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                status:
                  type: string
                  enum:
                    - 🚧
                    - ⏸️
                    - 👀
                    - ⏳
                    - ⛔️
                    - None
                priority:
                  type: string
                  enum:
                    - 🚨
                    - ‼️
                    - 🔺
                    - 🔻
                    - None
                effort:
                  type: string
                  enum:
                    - 🟢
                    - 🟡
                    - 🟠
                    - 🔴
                    - ⚫️
                    - None
                impact:
                  type: string
                  enum:
                    - ⬆️
                    - ↔️
                    - ⬇️
                    - None
                checkbox:
                  type: string
                  enum:
                    - Complete
                    - Incomplete
                suspend:
                  type: string
                  maxLength: 40
                  pattern: "^(?:|[A-Za-z]{3} \\d{1,2}(?: \\d{2}:\\d{2})?|\\d{1,2}:\\d{2})$"
                  description: "`MMM d`, `HH:mm`, or `MMM d HH:mm`; empty clears"
                clearEmojis:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/edit:
    post:
      summary: "Replace the text of a task row. Tokens: autonomy assist or higher, open row not 🙋 or held, and every marker (status, priority, effort, impact, dates, recurrence, gate marks) unchanged: 403 otherwise"
      operationId: editTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - text
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                text:
                  type: string
                  maxLength: 2000
                  description: Row text after the checkbox, single line Single line.
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current row text at ref; 409 conflict when the row differs (stale line number) Single line.
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/move:
    post:
      summary: "Move a task block before or after another task in the same project. Owner session only: 403 for tokens"
      operationId: moveTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - target
                - position
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                target:
                  $ref: "#/components/schemas/Ref"
                position:
                  type: string
                  enum:
                    - before
                    - after
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current row text at ref; 409 conflict on mismatch Single line.
                expectTarget:
                  type: string
                  maxLength: 2000
                  description: Expected current row text at target; 409 conflict on mismatch Single line.
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/remove-completed:
    post:
      summary: Remove completed tasks
      operationId: removeCompleted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                project:
                  type: string
                  maxLength: 200
                  description: Single line.
      responses:
        "200":
          description: Removed count
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: integer
                  files:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/Error"
  /tasks/triage:
    post:
      summary: Apply a triage suggestion (needs autonomy triage or higher; 403 otherwise)
      operationId: triageTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                agent:
                  type: string
                  maxLength: 200
                  description: One-line 🪄 subtask an agent can do Single line.
                human:
                  type: string
                  maxLength: 200
                  description: One-line 🙋 subtask needing a person Single line.
                priority:
                  type: string
                  enum:
                    - 🚨
                    - ‼️
                    - 🔺
                    - 🔻
                  description: Only fills a missing priority
                effort:
                  type: string
                  enum:
                    - 🟢
                    - 🟡
                    - 🟠
                    - 🔴
                    - ⚫️
                impact:
                  type: string
                  enum:
                    - ⬆️
                    - ↔️
                    - ⬇️
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                  ref:
                    type: string
                  applied:
                    type: array
                    items:
                      type: string
                  added:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/Error"
  /tasks/claim:
    post:
      summary: Claim a task (needs autonomy assist or higher; never a 🙋 row)
      operationId: claimTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                  ref:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /tasks/result:
    post:
      summary: Log an agent result in tasks/logs; completes only within autonomy, else defers to a 🙋 subtask
      operationId: recordResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - outcome
                - summary
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                outcome:
                  type: string
                  enum:
                    - done
                    - partial
                    - blocked
                    - needs-human
                summary:
                  type: string
                  maxLength: 500
                  description: One line; secrets are redacted Single line.
                complete:
                  type: boolean
                  description: Request completion; honored only within the task autonomy
                human:
                  type: string
                  maxLength: 200
                  description: Single line.
      responses:
        "200":
          description: Logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged:
                    type: boolean
                  completed:
                    type: boolean
                  deferred:
                    type: boolean
                  ref:
                    type: string
                  human:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /inbox:
    post:
      summary: "Send a reply or decision to the agent inbox of the task project (tasks/inbox). Owner session only: 403 for tokens"
      operationId: sendToInbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - text
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                text:
                  type: string
                  maxLength: 1000
                  description: Your words to the agent; secrets are redacted Single line.
                kind:
                  type: string
                  enum:
                    - reply
                    - decision
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current row text at ref; 409 conflict when the row differs Single line.
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  path:
                    type: string
        default:
          $ref: "#/components/responses/Error"
    get:
      summary: Inbox entries for agents to act on (open by default)
      operationId: listInbox
      parameters:
        - name: project
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - handled
              - all
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboxEntry"
        default:
          $ref: "#/components/responses/Error"
  /inbox/handled:
    post:
      summary: Mark an inbox entry handled after acting on it
      operationId: handleInboxEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
              properties:
                id:
                  type: string
                  maxLength: 64
                  pattern: ^in-[0-9TZ]+-[0-9a-f]{4,}$
                  description: Single line.
                note:
                  type: string
                  maxLength: 500
                  description: Single line.
      responses:
        "200":
          description: Handled
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /asks:
    get:
      summary: Asks for the owner, ranked by score (open by default). State answered lists asks waiting for the agent to act
      operationId: listAsks
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - answered
              - done
              - snoozed
              - all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Asks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ask"
                  total:
                    type: integer
                  latest:
                    type: string
                    format: date-time
                  snoozed:
                    type: integer
        default:
          $ref: "#/components/responses/Error"
  /asks/{key}:
    post:
      summary: Create or update an ask (tasks/asks/<key>.md). The key is stable, so writing it again updates the ask
      operationId: putAsk
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ask:
                  type: string
                  maxLength: 200
                  description: The one exact ask, one line. Required on create Single line.
                kind:
                  type: string
                  enum:
                    - approve
                    - decide
                    - review
                    - go-do
                    - answer
                  description: Required on create
                from:
                  type: string
                  maxLength: 80
                  description: Agent name; defaults to the token's name (the owner session writes as owner) Single line.
                project:
                  type: string
                  maxLength: 80
                  description: Single line.
                why:
                  type: string
                  maxLength: 500
                  description: Single line.
                recommend:
                  type: string
                  maxLength: 200
                  description: Single line.
                options:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 200
                default:
                  type: string
                  maxLength: 200
                  description: What happens if the owner stays silent Single line.
                by:
                  type: string
                  maxLength: 40
                  pattern: ^\d{4}-\d{2}-\d{2}(T[\d:.]+(Z|[+-]\d{2}:\d{2})?)?$
                  description: Deadline (ISO) Single line.
                reversible:
                  type: boolean
                link:
                  type: string
                  maxLength: 2000
                  pattern: ^https:\/\/[^\s]+$
                  description: Single line.
                priority:
                  type: string
                  enum:
                    - crit
                    - high
                    - normal
                    - low
                effort:
                  type: string
                  maxLength: 4
                  pattern: ^\d{1,3}[mh]$
                  description: Single line.
                blocks:
                  type: integer
                  minimum: 0
                  maximum: 99
                detail:
                  type: string
                  maxLength: 20000
                  description: Free markdown shown only when the owner expands the ask
                reopen:
                  type: boolean
                  description: Open a done ask again
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  created:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /asks/{key}/answer:
    post:
      summary: "Answer an ask (go, no, option, reply, ask, done, defer, retract). Owner session only: 403 for tokens"
      operationId: answerAsk
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - answer
              properties:
                answer:
                  type: string
                  enum:
                    - go
                    - no
                    - option
                    - reply
                    - ask
                    - done
                    - defer
                    - retract
                text:
                  type: string
                  maxLength: 1000
                  description: Required for option, reply, and ask Single line.
                until:
                  type: string
                  maxLength: 40
                  description: Required for defer (ISO, in the future) Single line.
      responses:
        "200":
          description: Answered
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /asks/{key}/handle:
    post:
      summary: Close an ask after acting (handled, resolved, defaulted) or reopen it with a reply to the owner
      operationId: handleAsk
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - outcome
              properties:
                outcome:
                  type: string
                  enum:
                    - handled
                    - resolved
                    - defaulted
                    - reopen
                note:
                  type: string
                  maxLength: 500
                  description: Single line.
                reply:
                  type: string
                  maxLength: 1000
                  description: One line shown to the owner on the reopened ask Single line.
      responses:
        "200":
          description: Handled
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /calendar:
    get:
      summary: "Calendar events overlapping a range (at most 7 days), read-only. Owner session only: 403 for tokens"
      operationId: listCalendar
      parameters:
        - name: from
          in: query
          schema:
            type: string
          description: ISO date-time, inclusive
        - name: to
          in: query
          schema:
            type: string
          description: ISO date-time, exclusive
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  error:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        subject:
                          type: string
                        start:
                          type: string
                          format: date-time
                        end:
                          type: string
                          format: date-time
                        allDay:
                          type: boolean
                        showAs:
                          type: string
                          enum:
                            - free
                            - tentative
                            - busy
                            - oof
                            - workingElsewhere
                            - unknown
                        cancelled:
                          type: boolean
                        online:
                          type: boolean
                        organizer:
                          type: string
                        webLink:
                          type: string
        default:
          $ref: "#/components/responses/Error"
  /agents:
    get:
      summary: What agents are doing, from agent rows, result logs, inbox replies, and pull request status
      operationId: listAgents
      responses:
        "200":
          description: Agent work
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentItem"
        default:
          $ref: "#/components/responses/Error"
  /projects:
    get:
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a project
      operationId: addProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: Single line.
                description:
                  type: string
                  maxLength: 2000
                  description: Single line.
                repositoryUrl:
                  type: string
                  maxLength: 2000
                  pattern: ^https?:\/\/[^\s()[\]<>]+$
                  description: Single line.
                  format: uri
                aliases:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 200
                priority:
                  type: number
                  minimum: 0
                  maximum: 1000000
                capacity:
                  type: object
                  maxProperties: 20
                  additionalProperties:
                    type: number
                    minimum: 0
                    maximum: 168
                weeklyCapacity:
                  type: number
                  minimum: 0
                  maximum: 168
                fileName:
                  type: string
                  maxLength: 100
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                  description: README is reserved; an existing file returns 409
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  project:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /projects/{name}:
    get:
      summary: Get one project
      operationId: getProject
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: File base name
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /summaries:
    get:
      summary: Generated summaries
      operationId: getSummaries
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Summary documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  readme:
                    type: string
                  stack:
                    type: string
                  projects:
                    type: string
                  myDay:
                    type: string
                    nullable: true
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    host:
      type: http
      scheme: bearer
      description: Supplied by the host through the authorize hook (auth-security slice).
  parameters:
    fields:
      name: fields
      in: query
      schema:
        type: string
      description: Comma-separated fields to return. Unknown names are rejected.
  responses:
    Mutation:
      description: Result of a change
      content:
        application/json:
          schema:
            type: object
            properties:
              changed:
                type: boolean
              ref:
                $ref: "#/components/schemas/Ref"
              before:
                type: string
              after:
                type: string
              message:
                type: string
    Error:
      description: "Error. Codes: bad_request 400, unauthorized 401, forbidden 403, not_found 404, method_not_allowed 405, conflict 409, payload_too_large 413, unsupported_media_type 415, invalid 422, internal 500."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CaptureResult:
      type: object
      properties:
        changed:
          type: boolean
        ref:
          $ref: "#/components/schemas/Ref"
        after:
          type: string
        spec:
          type: object
          properties:
            title:
              type: string
            due:
              type: string
              format: date
            effort:
              type: object
              properties:
                minutes:
                  type: integer
                emoji:
                  type: string
            project:
              type: string
            recurrence:
              type: object
              description: "offsetMonths is parsed and reported but not used by rolls: Quarterly-EOM+1 rolls to month end 3 months on."
              properties:
                cadence:
                  type: string
                  enum:
                    - daily
                    - weekly
                    - monthly
                    - quarterly
                    - yearly
                weekdays:
                  type: array
                  items:
                    type: string
                    enum:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                      - sat
                      - sun
                anchor:
                  type: string
                  enum:
                    - end-of-month
                offsetDays:
                  type: integer
                offsetMonths:
                  type: integer
                nominalDay:
                  type: string
                  format: date
    Ref:
      type: string
      pattern: ^(?![Rr][Ee][Aa][Dd][Mm][Ee]:)([^/\\:\0.][^/\\:\0]*):(\d{1,9})$
      example: alpha:12
      description: "`<project>:<line>`. README (any case) is reserved and never a valid project."
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - conflict
                - payload_too_large
                - unsupported_media_type
                - invalid
                - internal
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    InboxEntry:
      type: object
      description: One owner message in tasks/inbox/<project>.md. Agents act on open entries, then mark them handled.
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        project:
          type: string
        ref:
          $ref: "#/components/schemas/Ref"
        task:
          type: string
        kind:
          type: string
          enum:
            - reply
            - decision
        to:
          type: string
          enum:
            - agent
            - human
            - none
        text:
          type: string
        state:
          type: string
          enum:
            - open
            - handled
        handled:
          type: string
        note:
          type: string
        row:
          $ref: "#/components/schemas/Ref"
          description: Where the row is now, found by title (lines move); absent when the row is gone
    Ask:
      type: object
      description: One ask for the owner (tasks/asks/<key>.md) with its computed score and rank.
      properties:
        key:
          type: string
        state:
          type: string
          enum:
            - open
            - answered
            - done
        ask:
          type: string
        kind:
          type: string
          enum:
            - approve
            - decide
            - review
            - go-do
            - answer
        from:
          type: string
        project:
          type: string
        why:
          type: string
        recommend:
          type: string
        options:
          type: array
          items:
            type: string
        default:
          type: string
        by:
          type: string
          format: date-time
        reversible:
          type: boolean
        link:
          type: string
          format: uri
        priority:
          type: string
          enum:
            - crit
            - high
            - normal
            - low
        effort:
          type: string
        blocks:
          type: integer
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        answer:
          type: string
          enum:
            - go
            - no
            - option
            - reply
            - ask
            - done
            - defer
            - retract
        text:
          type: string
        answered:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
            - handled
            - resolved
            - defaulted
            - reopen
        handled:
          type: string
        note:
          type: string
        snoozed:
          type: string
          format: date-time
        detail:
          type: string
        score:
          type: integer
        rank:
          type: integer
        overdue:
          type: boolean
        snoozedUntil:
          type: string
          format: date-time
        agentReply:
          type: string
    AgentItem:
      type: object
      properties:
        ref:
          $ref: "#/components/schemas/Ref"
        project:
          type: string
        title:
          type: string
        text:
          type: string
        state:
          type: string
          enum:
            - failing
            - waiting
            - review
            - merged
            - ci
            - working
            - queued
        prs:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              repo:
                type: string
              number:
                type: integer
              state:
                type: string
                enum:
                  - open
                  - draft
                  - merged
                  - closed
              checks:
                type: string
                enum:
                  - passing
                  - failing
                  - pending
                  - none
              title:
                type: string
              updatedAt:
                type: string
        last:
          type: object
          properties:
            at:
              type: string
            action:
              type: string
            outcome:
              type: string
            summary:
              type: string
        waitingOn:
          $ref: "#/components/schemas/Ref"
        replies:
          type: integer
        since:
          type: string
    NextTask:
      type: object
      properties:
        ref:
          $ref: "#/components/schemas/Ref"
        text:
          type: string
        project:
          type: string
        score:
          type: number
    Task:
      type: object
      description: Default fields are ref, text, project, section, done. depth and notes only via fields.
      properties:
        ref:
          $ref: "#/components/schemas/Ref"
        text:
          type: string
        project:
          type: string
        section:
          type: string
        done:
          type: boolean
        depth:
          type: integer
        notes:
          type: array
          items:
            type: string
    Project:
      type: object
      description: Default fields are name, title, open, done.
      properties:
        name:
          type: string
        title:
          type: string
        open:
          type: integer
        done:
          type: integer
        aliases:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        sections:
          type: array
          items:
            type: object
            properties:
              heading:
                type: string
              open:
                type: integer
              done:
                type: integer
