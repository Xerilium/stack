# Generated by `pnpm openapi` from the api route table. Do not edit.
# @req FR:api/docs.openapi
openapi: 3.0.3
info:
  title: Stack API
  version: 0.0.1
  description: REST over the Stack core. JSON only, compact responses. Use `fields` to cut tokens. Tasks are addressed by `ref` = `project:line`. Authentication is supplied by the host (the handler denies every request when no authorize hook is configured).
servers:
  - url: /api
security:
  - host: []
paths:
  /next:
    get:
      summary: Top-ranked task
      operationId: next
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: "`task` is null when nothing is active."
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    allOf:
                      - $ref: "#/components/schemas/NextTask"
                    nullable: true
        default:
          $ref: "#/components/responses/Error"
  /rank:
    get:
      summary: "The ranked tasks: engine order plus the owner and Chief of Staff overrides (`.stack/priorities.json`). `/next` is the first; `root` is the top-level row a leaf sits under. `blocks=any` keeps tasks the current time block would hide"
      operationId: rank
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: blocks
          in: query
          schema:
            type: string
            enum:
              - now
              - any
      responses:
        "200":
          description: Ranked tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        ref:
                          $ref: "#/components/schemas/Ref"
                        text:
                          type: string
                        project:
                          type: string
                        score:
                          type: number
                        rule:
                          type: string
                          description: The override that applied
                        root:
                          $ref: "#/components/schemas/Ref"
        default:
          $ref: "#/components/responses/Error"
  /meetings:
    get:
      summary: "The owner's weekly meetings (`.stack/meetings.md`): days (0 = Sunday), local start and end, topic, owner agent, join link. Owner session only: 403 for tokens"
      operationId: listMeetings
      responses:
        "200":
          description: Meetings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        days:
                          type: array
                          items:
                            type: integer
                        start:
                          type: string
                        end:
                          type: string
                        biweekly:
                          type: boolean
                        topic:
                          type: string
                        owner:
                          type: string
                        join:
                          type: string
        default:
          $ref: "#/components/responses/Error"
  /needs-you:
    get:
      summary: The Chief of Staff's open decisions and go-dos (`.stack/needs-you.json`), each with a recommendation, a default, and a link
      operationId: listNeeds
      responses:
        "200":
          description: Needs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        recommendation:
                          type: string
                        default:
                          type: string
                        by:
                          type: string
                        link:
                          type: string
                        project:
                          type: string
                        ref:
                          type: string
                        kind:
                          type: string
                          enum:
                            - decision
                          description: "A PR priority recommendation: post actions to decide"
                        actions:
                          type: array
                          items:
                            type: string
                            enum:
                              - accept
                              - edit
                              - reject
                        decide:
                          type: string
                        answer:
                          type: object
                          properties:
                            choice:
                              type: string
                              enum:
                                - go
                                - defer
                                - reply
                            text:
                              type: string
                            until:
                              type: string
                            at:
                              type: string
                              format: date-time
        default:
          $ref: "#/components/responses/Error"
  /needs-you/{id}/answer:
    post:
      summary: "Record the owner's answer on a need (go, defer, reply) or clear it (undo). Owner session only: 403 for tokens"
      operationId: answerNeed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - choice
              properties:
                choice:
                  type: string
                  enum:
                    - go
                    - defer
                    - reply
                    - undo
                text:
                  type: string
                  maxLength: 1000
                  description: Required for reply Single line.
                until:
                  type: string
                  maxLength: 40
                  description: Required for defer (ISO) Single line.
      responses:
        "200":
          description: Answered
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /tasks:
    get:
      summary: List tasks
      operationId: listTasks
      parameters:
        - name: project
          in: query
          schema:
            type: string
        - name: section
          in: query
          schema:
            type: string
          description: Section heading text, emoji ignored
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - done
              - all
            default: open
        - name: q
          in: query
          schema:
            type: string
          description: Case-insensitive text match
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Page of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a task
      operationId: addTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - project
                - text
              properties:
                project:
                  type: string
                  maxLength: 200
                  description: File base name, title, or alias Single line.
                text:
                  type: string
                  maxLength: 2000
                  description: One line; cannot contain the 🤖 autonomy marker (only the owner sets autonomy) Single line.
                section:
                  type: string
                  maxLength: 200
                  description: Default Active Single line.
                parent:
                  $ref: "#/components/schemas/Ref"
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current parent row text; 409 conflict when the parent row differs (stale line number) Single line.
      responses:
        "201":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{ref}:
    get:
      summary: Get one task
      operationId: getTask
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Ref"
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"
  /capture:
    post:
      summary: Add a task from a natural-language or speech phrase
      operationId: captureTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 2000
                  description: 'Phrase such as "call dentist tomorrow 30m #alpha" Single line.'
                project:
                  type: string
                  maxLength: 200
                  description: "Used when the text has no #project or @project hint Single line."
                section:
                  type: string
                  maxLength: 200
                  description: Default Active Single line.
                dryRun:
                  type: boolean
                  description: Parse and render without writing (200)
      responses:
        "200":
          description: Dry run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"
        "201":
          description: Task added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"
        default:
          $ref: "#/components/responses/Error"
  /feedback:
    post:
      summary: Owner only. Append one feedback line to ~/.stack/feedback.jsonl (docs/feedback.md) for an agent to tail. Tokens in text and the route query are removed. 404 on hosts with no store
      operationId: sendFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 4000
                  description: The feedback
                route:
                  type: string
                  maxLength: 500
                  description: The app route (query string dropped) Single line.
                viewport:
                  type: string
                  maxLength: 11
                  pattern: ^\d{2,5}x\d{2,5}$
                  description: Width x height, such as 1280x800
                theme:
                  type: string
                  enum:
                    - light
                    - dark
                  description: The app theme
                capture:
                  type: boolean
                  description: Ask the desktop host to capture the window as the screenshot
                png:
                  type: string
                  maxLength: 1000000
                  pattern: ^[A-Za-z0-9+/]+={0,2}$
                  description: A base64 PNG screenshot (browser), at most 700 KB decoded
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - at
                  - screenshot
                properties:
                  id:
                    type: string
                  at:
                    type: string
                    format: date-time
                  screenshot:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /tasks/start:
    post:
      summary: "Start a task (ref omitted means the next task). Tokens: ref required, autonomy assist or higher; 403 otherwise"
      operationId: startTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/complete:
    post:
      summary: "Complete a task. Tokens: ref required; autonomy assist for a 🪄 subtask, full otherwise (403 when unset); remove is owner-only; 409 with an open 🙋 child"
      operationId: completeTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                summary:
                  type: string
                  maxLength: 10000
                  description: Single line.
                remove:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/skip:
    post:
      summary: Skip (park) a task. Owner session only (403 for tokens)
      operationId: skipTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/resume:
    post:
      summary: Resume a parked task. Owner session only (403 for tokens)
      operationId: resumeTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/suspend:
    post:
      summary: Suspend a task for days or hours. Owner session only (403 for tokens)
      operationId: suspendTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
                hours:
                  type: integer
                  minimum: 1
                  maximum: 8760
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/set:
    post:
      summary: "Set task properties. Tokens: ref required; autonomy triage (priority, effort, impact), assist (status), fills missing priority/effort/impact only; checkbox, clearEmojis, and gate marks are owner-only (403)"
      operationId: setTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                status:
                  type: string
                  enum:
                    - 🚧
                    - ⏸️
                    - 👀
                    - ⏳
                    - ⛔️
                    - None
                priority:
                  type: string
                  enum:
                    - 🚨
                    - ‼️
                    - 🔺
                    - 🔻
                    - None
                effort:
                  type: string
                  enum:
                    - 🟢
                    - 🟡
                    - 🟠
                    - 🔴
                    - ⚫️
                    - None
                impact:
                  type: string
                  enum:
                    - ⬆️
                    - ↔️
                    - ⬇️
                    - None
                checkbox:
                  type: string
                  enum:
                    - Complete
                    - Incomplete
                suspend:
                  type: string
                  maxLength: 40
                  pattern: "^(?:|[A-Za-z]{3} \\d{1,2}(?: \\d{2}:\\d{2})?|\\d{1,2}:\\d{2})$"
                  description: "`MMM d`, `HH:mm`, or `MMM d HH:mm`; empty clears"
                clearEmojis:
                  type: boolean
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current task text; 409 conflict when the row differs (stale line number) Single line.
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/edit:
    post:
      summary: "Replace the text of a task row. Tokens: autonomy assist or higher, open row not 🙋 or held, and every marker (status, priority, effort, impact, dates, recurrence, gate marks) unchanged: 403 otherwise"
      operationId: editTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - text
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                text:
                  type: string
                  maxLength: 2000
                  description: Row text after the checkbox, single line Single line.
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current row text at ref; 409 conflict when the row differs (stale line number) Single line.
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/move:
    post:
      summary: "Move a task block before or after another task in the same project. Owner session only: 403 for tokens"
      operationId: moveTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - target
                - position
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                target:
                  $ref: "#/components/schemas/Ref"
                position:
                  type: string
                  enum:
                    - before
                    - after
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current row text at ref; 409 conflict on mismatch Single line.
                expectTarget:
                  type: string
                  maxLength: 2000
                  description: Expected current row text at target; 409 conflict on mismatch Single line.
      responses:
        "200":
          $ref: "#/components/responses/Mutation"
        default:
          $ref: "#/components/responses/Error"
  /tasks/remove-completed:
    post:
      summary: Remove completed tasks
      operationId: removeCompleted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                project:
                  type: string
                  maxLength: 200
                  description: Single line.
      responses:
        "200":
          description: Removed count
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: integer
                  files:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/Error"
  /tasks/triage:
    post:
      summary: Apply a triage suggestion (needs autonomy triage or higher; 403 otherwise)
      operationId: triageTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                agent:
                  type: string
                  maxLength: 200
                  description: One-line 🪄 subtask an agent can do Single line.
                human:
                  type: string
                  maxLength: 200
                  description: One-line 🙋 subtask needing a person Single line.
                priority:
                  type: string
                  enum:
                    - 🚨
                    - ‼️
                    - 🔺
                    - 🔻
                  description: Only fills a missing priority
                effort:
                  type: string
                  enum:
                    - 🟢
                    - 🟡
                    - 🟠
                    - 🔴
                    - ⚫️
                impact:
                  type: string
                  enum:
                    - ⬆️
                    - ↔️
                    - ⬇️
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                  ref:
                    type: string
                  applied:
                    type: array
                    items:
                      type: string
                  added:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/Error"
  /tasks/claim:
    post:
      summary: Claim a task (needs autonomy assist or higher; never a 🙋 row)
      operationId: claimTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                  ref:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /tasks/result:
    post:
      summary: Log an agent result in tasks/logs; completes only within autonomy, else defers to a 🙋 subtask
      operationId: recordResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - outcome
                - summary
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                outcome:
                  type: string
                  enum:
                    - done
                    - partial
                    - blocked
                    - needs-human
                summary:
                  type: string
                  maxLength: 500
                  description: One line; secrets are redacted Single line.
                complete:
                  type: boolean
                  description: Request completion; honored only within the task autonomy
                human:
                  type: string
                  maxLength: 200
                  description: Single line.
      responses:
        "200":
          description: Logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged:
                    type: boolean
                  completed:
                    type: boolean
                  deferred:
                    type: boolean
                  ref:
                    type: string
                  human:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /inbox:
    post:
      summary: "Send a reply or decision to the agent inbox of the task project (tasks/inbox). Owner session only: 403 for tokens"
      operationId: sendToInbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - text
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                text:
                  type: string
                  maxLength: 1000
                  description: Your words to the agent; secrets are redacted Single line.
                kind:
                  type: string
                  enum:
                    - reply
                    - decision
                    - instruction
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current row text at ref; 409 conflict when the row differs Single line.
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  path:
                    type: string
        default:
          $ref: "#/components/responses/Error"
    get:
      summary: Inbox entries for agents to act on (open by default)
      operationId: listInbox
      parameters:
        - name: project
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - handled
              - all
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboxEntry"
        default:
          $ref: "#/components/responses/Error"
  /inbox/handled:
    post:
      summary: Mark an inbox entry handled after acting on it
      operationId: handleInboxEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
              properties:
                id:
                  type: string
                  maxLength: 64
                  pattern: ^in-[0-9TZ]+-[0-9a-f]{4,}$
                  description: Single line.
                note:
                  type: string
                  maxLength: 500
                  description: Single line.
                withdrawn:
                  type: boolean
                  description: "Owner only (403 for tokens): the owner took the message back (Undo); lists and the thread then hide it"
      responses:
        "200":
          description: Handled
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /asks:
    get:
      summary: Asks for the owner, ranked by score (open by default). State answered lists asks waiting for the agent to act
      operationId: listAsks
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - answered
              - done
              - snoozed
              - all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Asks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ask"
                  total:
                    type: integer
                  latest:
                    type: string
                    format: date-time
                  snoozed:
                    type: integer
        default:
          $ref: "#/components/responses/Error"
  /asks/{key}:
    post:
      summary: Create or update an ask (tasks/asks/<key>.md). The key is stable, so writing it again updates the ask. A token gets 403 on an ask another writer created and on perm-* keys
      operationId: putAsk
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                  description: The task this ask belongs to (project:line); the task must exist
                ask:
                  type: string
                  maxLength: 200
                  description: The one exact ask, one line. Required on create Single line.
                kind:
                  type: string
                  enum:
                    - approve
                    - decide
                    - review
                    - go-do
                    - answer
                  description: Required on create
                from:
                  type: string
                  maxLength: 80
                  description: Agent name; defaults to the token's name (the owner session writes as owner) Single line.
                project:
                  type: string
                  maxLength: 80
                  description: Single line.
                why:
                  type: string
                  maxLength: 500
                  description: Single line.
                recommend:
                  type: string
                  maxLength: 200
                  description: Single line.
                options:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 200
                default:
                  type: string
                  maxLength: 200
                  description: What happens if the owner stays silent Single line.
                by:
                  type: string
                  maxLength: 40
                  pattern: ^\d{4}-\d{2}-\d{2}(T[\d:.]+(Z|[+-]\d{2}:\d{2})?)?$
                  description: Deadline (ISO) Single line.
                reversible:
                  type: boolean
                link:
                  type: string
                  maxLength: 2000
                  pattern: ^https:\/\/[^\s]+$
                  description: Single line.
                priority:
                  type: string
                  enum:
                    - crit
                    - high
                    - normal
                    - low
                effort:
                  type: string
                  maxLength: 4
                  pattern: ^\d{1,3}[mh]$
                  description: Single line.
                blocks:
                  type: integer
                  minimum: 0
                  maximum: 99
                detail:
                  type: string
                  maxLength: 20000
                  description: Free markdown shown only when the owner expands the ask
                reopen:
                  type: boolean
                  description: Open a done ask again
                flow:
                  type: string
                  maxLength: 80
                  pattern: ^[a-z0-9][a-z0-9._-]{0,79}$
                  description: "Quick triage: the flow this question belongs to (slug) Single line."
                seq:
                  type: integer
                  minimum: 1
                  maximum: 99
                  description: Its place in the flow (1-99)
                apply:
                  type: string
                  maxLength: 500
                  description: "Action Stack runs on go: set prop=value…, due Mon d, suspend 7d, skip, complete, start, resume, note text Single line."
                applies:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 200
                  description: One action per option (- for none)
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  created:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /asks/{key}/answer:
    post:
      summary: "Answer an ask (go, no, option, reply, ask, done, defer, retract). Owner session only: 403 for tokens"
      operationId: answerAsk
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - answer
              properties:
                answer:
                  type: string
                  enum:
                    - go
                    - no
                    - option
                    - reply
                    - ask
                    - done
                    - defer
                    - retract
                text:
                  type: string
                  maxLength: 1000
                  description: Required for option, reply, and ask Single line.
                until:
                  type: string
                  maxLength: 40
                  description: Required for defer (ISO, in the future) Single line.
      responses:
        "200":
          description: Answered
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /asks/{key}/handle:
    post:
      summary: Close an ask after acting (handled, resolved, defaulted) or reopen it with a reply to the owner
      operationId: handleAsk
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - outcome
              properties:
                outcome:
                  type: string
                  enum:
                    - handled
                    - resolved
                    - defaulted
                    - reopen
                note:
                  type: string
                  maxLength: 500
                  description: Single line.
                reply:
                  type: string
                  maxLength: 1000
                  description: One line shown to the owner on the reopened ask Single line.
      responses:
        "200":
          description: Handled
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /reports:
    post:
      summary: Store an agent status report in the host live store (~/.stack, never git); the latest per agent and project replaces the prior; its asks show in Needs you. 400 lists every schema issue; 404 on hosts with no store. See docs/report.md
      operationId: putReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: string
                  project:
                    type: string
                  created:
                    type: boolean
                  asks:
                    type: object
                    properties:
                      put:
                        type: array
                        items:
                          type: string
                      dropped:
                        type: array
                        items:
                          type: string
                      answers:
                        type: object
                        description: "Owner answers on the kept asks, by ask key: {choice, text?, until?, at}"
                        additionalProperties:
                          type: object
                          properties:
                            choice:
                              type: string
                              enum:
                                - go
                                - defer
                                - reply
                            text:
                              type: string
                            until:
                              type: string
                            at:
                              type: string
        default:
          $ref: "#/components/responses/Error"
  /session-inventory:
    get:
      summary: "Owner only. Claude app sessions on this machine (read-only, cached by mtime in ~/.stack/sessions.json): counts per state, the ranked Needs-you list (waiting, stuck), archive candidates, and every session. No transcript text. 404 on hosts with no inventory"
      operationId: listSessionInventory
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        default:
          $ref: "#/components/responses/Error"
  /pris:
    get:
      summary: Owner only. The owner priorities, most important first (~/.stack/pris.json); rev 0 and an empty list when none. 404 on hosts with no store
      operationId: getPriorities
      responses:
        "200":
          description: Priorities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrisFile"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: "Owner only. Replace the priorities list. Send the rev you read: a stale rev is 409. 400 lists every issue"
      operationId: putPriorities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - rev
                - pris
              properties:
                rev:
                  type: integer
                  minimum: 0
                pris:
                  type: array
                  maxItems: 30
                  items:
                    $ref: "#/components/schemas/Pri"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrisFile"
        default:
          $ref: "#/components/responses/Error"
  /pr-priority:
    get:
      summary: Owner only. The PR priority queue for the Sweep Manager (~/.stack/pr-priority.json), each PR with cached facts, merge-order edges, the newest report record, acks and status, plus the escalation set and open recommendations (by project, oldest first). 404 on hosts with no store
      operationId: getPrPriority
      responses:
        "200":
          description: PR priorities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrPriView"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: "Owner only. One idempotent queue action: add (default top), move (to top, up, down, or rank), pin, unpin, remove, undo (restores the prior revision), or ack (a hold thread). Send the rev you read: a stale rev is 409; a PR not queued is 404"
      operationId: changePrPriority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - rev
                - op
              properties:
                rev:
                  type: integer
                  minimum: 0
                  maximum: 1000000000
                op:
                  type: string
                  enum:
                    - add
                    - move
                    - pin
                    - unpin
                    - remove
                    - undo
                    - ack
                ref:
                  type: string
                  maxLength: 300
                  description: <owner>/<name>#<n> or a GitHub PR url; required except for undo Single line.
                rank:
                  type: integer
                  minimum: 1
                  maximum: 100
                to:
                  type: string
                  enum:
                    - top
                    - up
                    - down
                  description: "For move: top, up or down (or send rank)"
                note:
                  type: string
                  maxLength: 300
                  description: "For add and move: the item note; for ack: the ack note Single line."
                thread:
                  type: string
                  maxLength: 2000
                  description: "For ack: the https url of the thread Single line."
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrPriView"
        default:
          $ref: "#/components/responses/Error"
  /pr-priority/recommendations:
    post:
      summary: An agent recommends a higher rank for a PR. Returns the new or already open recommendation. 409 when the owner rejected a similar reason in the last 14 days (the message has his reason), when the PR is already queued high enough, or when it is excluded
      operationId: recommendPrPriority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - repo
                - number
                - agent
                - reason
              properties:
                repo:
                  type: string
                  maxLength: 140
                  description: Single line.
                number:
                  type: integer
                  minimum: 1
                  maximum: 9999999
                agent:
                  type: string
                  maxLength: 40
                  description: Single line.
                reason:
                  type: string
                  maxLength: 300
                  description: Single line.
                toRank:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        "200":
          description: Recommended
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: boolean
                  rec:
                    $ref: "#/components/schemas/PrRec"
        default:
          $ref: "#/components/responses/Error"
    get:
      summary: Decided recommendations (accepted, edited, rejected with the owner reason), newest first, so agents do not retry
      operationId: listPrPriorityDecisions
      parameters:
        - name: agent
          in: query
          schema:
            type: string
            description: Single line.
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrRec"
        default:
          $ref: "#/components/responses/Error"
  /pr-priority/recommendations/{id}:
    post:
      summary: Owner only. Accept, edit, or reject a recommendation. Edit and reject need a reason. The same decision again is a no-op; another decision is 409
      operationId: decidePrPriority
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - accept
                    - edit
                    - reject
                rank:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: "For edit: the rank to use"
                note:
                  type: string
                  maxLength: 300
                  description: "For edit: the item note Single line."
                reason:
                  type: string
                  maxLength: 300
                  description: Required for edit and reject Single line.
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                  rec:
                    $ref: "#/components/schemas/PrRec"
                  queue:
                    type: object
        default:
          $ref: "#/components/responses/Error"
  /prs:
    get:
      summary: "Owner only. Open PRs the owner reviews or moves, grouped (blocked, waiting, processing, pending, paused), with who must act, CI, unresolved threads, queue rank, and the escalation set. Taking it renews a 3-minute poll lease. `{off: true}` on hosts with no GitHub token"
      operationId: getPrBoard
      responses:
        "200":
          description: Board
          content:
            application/json:
              schema:
                type: object
                properties:
                  at:
                    type: string
                    nullable: true
                  user:
                    type: string
                  agents:
                    type: object
                  counts:
                    type: object
                  footer:
                    type: object
                  rows:
                    type: array
                    items:
                      type: object
                  escalations:
                    type: object
                  queue:
                    type: boolean
                  rate:
                    type: object
                  error:
                    type: string
                  off:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /prs/queue:
    post:
      summary: "Owner only. Change the PR priority queue through stack pr-pri: top, up, down, move (to rank), add (at the top), pin, unpin, remove, undo. 409 when the queue is not installed or refuses"
      operationId: movePrInQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - repo
                - number
                - op
              properties:
                repo:
                  type: string
                  maxLength: 140
                  pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9._-]{1,100}$
                number:
                  type: integer
                  minimum: 1
                  maximum: 9999999
                op:
                  type: string
                  enum:
                    - top
                    - up
                    - down
                    - move
                    - add
                    - pin
                    - unpin
                    - remove
                    - undo
                  description: top, up, down, move, add, pin, unpin, remove, or undo
                rank:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Target rank for move
      responses:
        "200":
          description: New rank
          content:
            application/json:
              schema:
                type: object
                properties:
                  rank:
                    type: integer
                    nullable: true
                  was:
                    type: integer
                    nullable: true
                  pinned:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /prs/label:
    post:
      summary: Owner only. Add or remove the Autopilot label (no other label). 403 for repos outside STACK_GITHUB_REPOS
      operationId: labelPr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - repo
                - number
                - op
              properties:
                repo:
                  type: string
                  maxLength: 140
                  pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9._-]{1,100}$
                number:
                  type: integer
                  minimum: 1
                  maximum: 9999999
                op:
                  type: string
                  enum:
                    - add
                    - remove
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /prs/ack:
    post:
      summary: Owner only. Record the owner answer on a thread (stack pr-pri ack --thread --note). With post true, first post text (must start with the AI prefix) as a thread reply (replyTo) or a PR comment
      operationId: ackPr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - repo
                - number
                - thread
                - note
              properties:
                repo:
                  type: string
                  maxLength: 140
                  pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9._-]{1,100}$
                number:
                  type: integer
                  minimum: 1
                  maximum: 9999999
                thread:
                  type: string
                  maxLength: 500
                  pattern: ^https:\/\/github\.com\/\S+$
                  description: Thread or PR url the answer is for Single line.
                note:
                  type: string
                  maxLength: 300
                  description: The answer Single line.
                post:
                  type: boolean
                text:
                  type: string
                  maxLength: 4000
                replyTo:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /prs/recs/{id}:
    post:
      summary: Owner only. Accept, edit, or reject a PR priority recommendation; edit and reject need a reason
      operationId: decidePrRec
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - accept
                    - edit
                    - reject
                rank:
                  type: integer
                  minimum: 1
                  maximum: 100
                note:
                  type: string
                  maxLength: 300
                  description: Single line.
                reason:
                  type: string
                  maxLength: 300
                  description: Single line.
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /pr-review:
    get:
      summary: Cached PR facts (specLines, live flag, head SHA) and agent briefs with stale. No GitHub call. 404 on hosts with no store
      operationId: getPrReview
      responses:
        "200":
          description: PR review
          content:
            application/json:
              schema:
                type: object
                required:
                  - facts
                  - briefs
                properties:
                  facts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrFacts"
                  briefs:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrBrief"
        default:
          $ref: "#/components/responses/Error"
  /live:
    get:
      summary: "The live validation lane: state (idle when no PR), the active PR, its checklist, and done PRs. 404 on hosts with no lane"
      operationId: getLiveLane
      responses:
        "200":
          description: Lane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLane"
        default:
          $ref: "#/components/responses/Error"
  /live/items:
    post:
      summary: "Change one checklist item of the live PR: add, check, uncheck, fail, needs-fix, fixed, block, comment, edit. Owner calls are by owner; token calls are by the token name. 404 when the PR is not live or the id is unknown"
      operationId: changeLiveItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - op
                - repo
                - number
              properties:
                op:
                  type: string
                  enum:
                    - add
                    - check
                    - uncheck
                    - fail
                    - needs-fix
                    - fixed
                    - block
                    - comment
                    - edit
                repo:
                  type: string
                  maxLength: 140
                  pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9._-]{1,100}$
                  description: Single line.
                number:
                  type: integer
                  minimum: 1
                  maximum: 9999999
                id:
                  type: string
                  maxLength: 11
                  pattern: ^li-[0-9a-f]{8}$
                  description: Required for every op except add Single line.
                text:
                  type: string
                  maxLength: 300
                  description: Required for add, comment, edit; the comment for needs-fix Single line.
                reason:
                  type: string
                  maxLength: 300
                  description: Required for block Single line.
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                type: object
                required:
                  - changed
                  - item
                properties:
                  changed:
                    type: boolean
                  item:
                    $ref: "#/components/schemas/LiveItem"
        default:
          $ref: "#/components/responses/Error"
  /inbox-items:
    get:
      summary: "All mail, unread Teams, Slack and GitHub items, each with a summary and a suggested action, plus the action catalog and the source status (as GET /inbox-sources). Owner session only: 403 for tokens"
      operationId: listInboxItems
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        ready:
                          type: boolean
                  sources: &a1
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum:
                            - email
                            - github
                            - teams
                            - slack
                        account:
                          type: string
                        state:
                          type: string
                          enum:
                            - not-connected
                            - connecting
                            - ok
                            - error
                            - stale
                        lastSyncAt:
                          type: string
                          format: date-time
                        error:
                          type: string
                        needs:
                          type: string
                        command:
                          type: string
                        doc:
                          type: string
                        mode:
                          type: string
                          enum:
                            - read-only
                            - drafts
                        planned:
                          type: boolean
                  summary: &a2
                    type: object
                    properties:
                      connected:
                        type: integer
                      total:
                        type: integer
                      fresh:
                        type: integer
                      attention:
                        type: boolean
                      canClaimZero:
                        type: boolean
                      headline:
                        type: string
                        nullable: true
        default:
          $ref: "#/components/responses/Error"
  /inbox-sources:
    get:
      summary: "Each inbox source (every email account, GitHub, and planned Teams and Slack) with its state, last sync and the exact step to connect it, plus a summary (N of M connected, whether Inbox zero may be claimed, a headline). fresh=1 re-probes this machine. Never a token. Owner session only: 403 for tokens"
      operationId: listInboxSources
      parameters:
        - name: fresh
          in: query
          schema:
            type: string
            enum:
              - "1"
              - "true"
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources: *a1
                  summary: *a2
        default:
          $ref: "#/components/responses/Error"
  /inbox-items/{id}/action:
    post:
      summary: "Run an inbox action (reply-draft makes a draft and never sends), or with request true file a request for a missing action. Owner session only: 403 for tokens"
      operationId: inboxAction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - reply-draft
                    - mark-done
                    - snooze
                    - ask-me-later
                    - create-task
                    - archive
                    - unsubscribe
                    - delegate
                    - schedule
                    - forward-draft
                text:
                  type: string
                  maxLength: 5000
                  description: Draft text for reply-draft
                until:
                  type: string
                  maxLength: 40
                  description: ISO date for snooze Single line.
                request:
                  type: boolean
                  description: File a GitHub issue (label help wanted) for a missing action
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /brief/summary:
    get:
      summary: "AI daily brief over the top open asks, cached per day. Owner session only: 403 for tokens. configured is false when the host has no model"
      operationId: briefSummary
      parameters:
        - name: refresh
          in: query
          schema:
            type: string
          description: 1 forces a new model call
      responses:
        "200":
          description: Brief
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  date:
                    type: string
                  headline:
                    type: string
                  cached:
                    type: boolean
                  error:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        text:
                          type: string
                        note:
                          type: string
                        action:
                          type: string
                          enum:
                            - go
                            - no
                            - done
                            - none
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    get:
      summary: Live agent sessions on this machine, attention first (needs-you, running, active, idle, stale). 404 on hosts that cannot run agents
      operationId: listSessions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  total:
                    type: integer
                  indexing:
                    type: integer
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: "Start a new agent session in a folder and send it a prompt. Owner session only: 403 for tokens"
      operationId: newSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                cwd:
                  type: string
                  maxLength: 1000
                  description: "Absolute path to an existing folder; default: the served folder (also with agent, ref, or project: an agent can be started in its project repo) Single line."
                text:
                  type: string
                  maxLength: 4000
                  description: The prompt
                agent:
                  type: string
                  maxLength: 40
                  pattern: ^[a-z0-9][a-z0-9._-]{0,39}$
                  description: "Agent slug (tasks/agents/<slug>.md); default: the active agent for the task or project Single line."
                ref:
                  $ref: "#/components/schemas/Ref"
                  description: "The task the session is about: its row, notes, and subtasks become context and the agent persona is applied"
                project:
                  type: string
                  maxLength: 200
                  description: Project when there is no task (404 when it has no file) Single line.
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  sessionId:
                    type: string
                    nullable: true
                  agent:
                    type: string
                    description: Set for a task or project session
                  title:
                    type: string
                    description: "Set for a task or project session: `<agent> · <task> · <ref>`"
        default:
          $ref: "#/components/responses/Error"
  /sessions/cost:
    get:
      summary: Agent spend by day, project, and model; a session counts on the date of its last activity in the owner's configured timezone (else UTC)
      operationId: sessionCost
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: Cost report
          content:
            application/json:
              schema:
                type: object
                properties:
                  attribution:
                    type: string
                    enum:
                      - lastActive
                  indexing:
                    type: integer
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        usd:
                          type: number
                        tokens:
                          type: integer
                        sessions:
                          type: integer
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        project:
                          type: string
                        usd:
                          type: number
                        tokens:
                          type: integer
                        sessions:
                          type: integer
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        model:
                          type: string
                        usd:
                          type: number
                        tokens:
                          type: integer
                  total:
                    type: object
                    properties:
                      usd:
                        type: number
                      tokens:
                        type: integer
                      sessions:
                        type: integer
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/messages:
    get:
      summary: "The last turns of a session: user and assistant text, tool calls as one line each"
      operationId: sessionMessages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Turns
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        at:
                          type: string
                        role:
                          type: string
                          enum:
                            - user
                            - assistant
                        text:
                          type: string
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/prompt:
    post:
      summary: "Resume a session with a prompt; updates stream on /sessions/{id}/events. Owner session only: 403 for tokens; 409 when the session is active elsewhere or already running"
      operationId: promptSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 4000
                  description: The prompt
                ref:
                  $ref: "#/components/schemas/Ref"
                  description: "The task the follow-up is about: the agent persona (and model) is applied again, since a resumed session carries no system prompt"
                agent:
                  type: string
                  maxLength: 40
                  pattern: ^[a-z0-9][a-z0-9._-]{0,39}$
                  description: "Agent slug for the persona; default: the active agent for the task Single line."
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  sessionId:
                    type: string
                    nullable: true
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/cancel:
    post:
      summary: Stop the run in flight for a session. Owner session only
      operationId: cancelSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /calendar:
    get:
      summary: "Calendar events overlapping a range (at most 7 days), read-only. Owner session only: 403 for tokens"
      operationId: listCalendar
      parameters:
        - name: from
          in: query
          schema:
            type: string
          description: ISO date-time, inclusive
        - name: to
          in: query
          schema:
            type: string
          description: ISO date-time, exclusive
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  error:
                    type: string
                  source:
                    type: object
                    description: How the calendar source is doing; never holds a feed path or token
                    properties:
                      kind:
                        type: string
                        enum:
                          - calendar
                      via:
                        type: string
                        enum:
                          - graph
                          - ics
                          - fixture
                          - none
                      account:
                        type: string
                        description: Sign-in address or feed host names
                      state:
                        type: string
                        enum:
                          - not-connected
                          - ok
                          - error
                          - stale
                      lastSyncAt:
                        type: string
                        format: date-time
                        description: When the data shown was last read from the source
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        subject:
                          type: string
                        start:
                          type: string
                          format: date-time
                        end:
                          type: string
                          format: date-time
                        allDay:
                          type: boolean
                        showAs:
                          type: string
                          enum:
                            - free
                            - tentative
                            - busy
                            - oof
                            - workingElsewhere
                            - unknown
                        cancelled:
                          type: boolean
                        online:
                          type: boolean
                        organizer:
                          type: string
                        webLink:
                          type: string
                        joinUrl:
                          type: string
                          description: Online meeting join link
        default:
          $ref: "#/components/responses/Error"
  /inbox/reply:
    post:
      summary: "An agent's reply on a task (tasks/inbox, from: agent, named by the token). Tokens only: the owner session gets 403"
      operationId: replyFromAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
                - text
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                text:
                  type: string
                  maxLength: 1000
                  description: One line to the owner; secrets are redacted Single line.
                expect:
                  type: string
                  maxLength: 2000
                  description: Expected current row text; 409 when the row differs Single line.
      responses:
        "201":
          description: Written
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  path:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /inbox/delivery:
    get:
      summary: "Delivery state of the owner messages on one row (working, delivered, failed, not-delivered), the delivery mode, the Claude login state, and a live session for the agent when there is one (link only). Owner session only: 403 for tokens; 404 where the host does not deliver"
      operationId: getInboxDelivery
      parameters:
        - name: ref
          in: query
          schema:
            $ref: "#/components/schemas/Ref"
          description: The row (project:line)
      responses:
        "200":
          description: Delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                      - claude
                      - off
                  login:
                    type: string
                    enum:
                      - ok
                      - expired
                      - unknown
                  items:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        state:
                          type: string
                          enum:
                            - working
                            - delivered
                            - failed
                            - not-delivered
                        agent:
                          type: string
                        reason:
                          type: string
                  live:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      link:
                        type: string
        default:
          $ref: "#/components/responses/Error"
  /inbox/delivery/login:
    post:
      summary: "Start the Claude sign-in (claude auth login) on this machine; when it cannot start, the answer names the one step. Owner session only: 403 for tokens"
      operationId: startDeliveryLogin
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  started:
                    type: boolean
                  step:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /tasks/{ref}/thread:
    get:
      summary: "One task's thread in time order: the owner's messages, the agent's replies, its asks, the review verdict, agent-owned subtasks; plus the task's newest session when a runner exists"
      operationId: getTaskThread
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Ref"
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThreadItem"
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      state:
                        type: string
                  review:
                    $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{ref}/assign:
    post:
      summary: "Hand the task to its agent: claims the row (log + in progress) and starts a session with the assign prompt. Owner session only; 404 without a runner; 403 for a 🙋 row"
      operationId: assignTask
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Ref"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                agent:
                  type: string
                  maxLength: 40
                  pattern: ^[a-z0-9][a-z0-9._-]{0,39}$
                  description: "Agent slug; default: the active agent Single line."
                note:
                  type: string
                  maxLength: 1000
                  description: The owner's note, added to the assign prompt (at most 1000 characters) Single line.
      responses:
        "202":
          description: Assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  sessionId:
                    type: string
                    nullable: true
                  agent:
                    type: string
                  title:
                    type: string
                  claimed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /team:
    get:
      summary: "The team: tasks/agents/<slug>.md, .claude/agents/<slug>.md and project Agents lines, each with who it reports to; with project, the agents that cover it, the roll-up first"
      operationId: listTeam
      parameters:
        - name: project
          in: query
          schema:
            type: string
            description: Single line.
          description: "Project name: only the agents whose scope covers it, the roll-up first then most specific first"
        - name: section
          in: query
          schema:
            type: string
            description: Single line.
          description: Section heading, for section-scoped agents
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamAgent"
        default:
          $ref: "#/components/responses/Error"
  /reviews:
    get:
      summary: Every row's newest review in a project (verdict, plan, estimate, agent, open need asks)
      operationId: listReviews
      parameters:
        - name: project
          in: query
          schema:
            type: string
            description: Single line.
          description: Project name
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Error"
  /tasks/review:
    post:
      summary: "Ask the task's agent whether it can do the task: a read-only run whose verdict lands in the result log and whose needs become asks. Owner session only: 403 for tokens and for a 🙋 row; 404 without a runner"
      operationId: reviewTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ref
              properties:
                ref:
                  $ref: "#/components/schemas/Ref"
                agent:
                  type: string
                  maxLength: 40
                  pattern: ^[a-z0-9][a-z0-9._-]{0,39}$
                  description: "Agent slug; default: the active agent Single line."
      responses:
        "202":
          description: Review started
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  sessionId:
                    type: string
                    nullable: true
                  agent:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /schedule:
    get:
      summary: "The waking day (wake, bed, time blocks) that contains an instant, from the time blocks in stack.json. Owner session only: 403 for tokens"
      operationId: getSchedule
      parameters:
        - name: at
          in: query
          schema:
            type: string
          description: ISO date-time; default now
      responses:
        "200":
          description: Day
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                  date:
                    type: string
                    description: Local date the day started on (YYYY-MM-DD)
                  wake:
                    type: string
                    format: date-time
                  bed:
                    type: string
                    format: date-time
                  asleep:
                    type: boolean
                    description: The instant is in sleep time; the day is the next waking day
                  blocks:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        label:
                          type: string
                        emoji:
                          type: string
                        kind:
                          type: string
                          enum:
                            - focus
                            - personal
                            - sleep
                        start:
                          type: string
                          format: date-time
                        end:
                          type: string
                          format: date-time
        default:
          $ref: "#/components/responses/Error"
  /schedule/day:
    post:
      summary: Change wake or bed for a date, or with every for its weekday (which also removes that date's own change); reset removes it. Saved in .stack/schedule.json. Owner session only
      operationId: setScheduleDay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - date
              properties:
                date:
                  type: string
                  maxLength: 10
                wake:
                  type: string
                  maxLength: 5
                bed:
                  type: string
                  maxLength: 5
                every:
                  type: boolean
                reset:
                  type: boolean
      responses:
        "200":
          description: Day
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                  date:
                    type: string
                  wake:
                    type: string
                    format: date-time
                  bed:
                    type: string
                    format: date-time
                  asleep:
                    type: boolean
                  blocks:
                    type: array
                    items:
                      type: object
        default:
          $ref: "#/components/responses/Error"
  /agents:
    get:
      summary: What agents are doing, from agent rows, result logs, inbox replies, and pull request status
      operationId: listAgents
      responses:
        "200":
          description: Agent work
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentItem"
        default:
          $ref: "#/components/responses/Error"
  /sync:
    get:
      summary: "Change probe: the head revision of the task repo (null when the storage has none), plus pending/since when the storage batches commits. Poll it and reload only when rev changes"
      operationId: sync
      responses:
        "200":
          description: Sync state
          content:
            application/json:
              schema:
                type: object
                properties:
                  rev:
                    type: string
                    nullable: true
                  pending:
                    type: integer
                    description: Writes not yet committed (batching storage only)
                  since:
                    type: string
                    format: date-time
                    nullable: true
                    description: First pending write (batching storage only)
                  live:
                    type: string
                    description: Changes when live state outside the repo (PR priorities) changes; present only when the host has it
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Commit and push pending edits now (owner only). flushed is 0 when nothing was pending or the storage does not batch
      operationId: flushSync
      responses:
        "200":
          description: Flush result
          content:
            application/json:
              schema:
                type: object
                properties:
                  flushed:
                    type: integer
                  rev:
                    type: string
                    nullable: true
        default:
          $ref: "#/components/responses/Error"
  /version:
    get:
      summary: "Desktop app only: the running and available builds, whether an update is ready, the update mode, and the last helper result. 404 on hosts with no installer. Reads only local files"
      operationId: getVersion
      responses:
        "200":
          description: Version state
          content:
            application/json:
              schema: &a4
                type: object
                properties:
                  running: &a3
                    type: object
                    nullable: true
                    properties:
                      version:
                        type: string
                      sha:
                        type: string
                      dirty:
                        type: boolean
                      builtAt:
                        type: string
                        format: date-time
                  available: *a3
                  ready:
                    type: boolean
                  mode:
                    type: string
                    enum:
                      - on-quit
                      - ask
                      - auto-idle
                      - off
                  idleMinutes:
                    type: integer
                  canRestart:
                    type: boolean
                  last:
                    type: object
                    nullable: true
                    properties:
                      ok:
                        type: boolean
                      step:
                        type: string
                      at:
                        type: string
        default:
          $ref: "#/components/responses/Error"
  /version/mode:
    post:
      summary: "Set when updates install: on-quit (default), ask, auto-idle, or off (owner only). Saved in ~/.config/stack/config.json"
      operationId: setUpdateMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - on-quit
                    - ask
                    - auto-idle
                    - off
                idleMinutes:
                  type: integer
                  minimum: 5
                  maximum: 240
      responses:
        "200":
          description: Version state
          content:
            application/json:
              schema: *a4
        default:
          $ref: "#/components/responses/Error"
  /version/restart:
    post:
      summary: Commit pending edits, then quit, swap in the ready build, and relaunch (owner only). 409 when no update is ready or the host cannot restart
      operationId: restartForUpdate
      responses:
        "200":
          description: Restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  restarting:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /projects:
    get:
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a project
      operationId: addProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: Single line.
                description:
                  type: string
                  maxLength: 2000
                  description: Single line.
                repositoryUrl:
                  type: string
                  maxLength: 2000
                  pattern: ^https?:\/\/[^\s()[\]<>]+$
                  description: Single line.
                  format: uri
                aliases:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 200
                priority:
                  type: number
                  minimum: 0
                  maximum: 1000000
                capacity:
                  type: object
                  maxProperties: 20
                  additionalProperties:
                    type: number
                    minimum: 0
                    maximum: 168
                weeklyCapacity:
                  type: number
                  minimum: 0
                  maximum: 168
                fileName:
                  type: string
                  maxLength: 100
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                  description: README is reserved; an existing file returns 409
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  project:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /projects/{name}:
    get:
      summary: Get one project
      operationId: getProject
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: File base name
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /summaries:
    get:
      summary: Generated summaries
      operationId: getSummaries
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: Summary documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  readme:
                    type: string
                  stack:
                    type: string
                  projects:
                    type: string
                  myDay:
                    type: string
                    nullable: true
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    host:
      type: http
      scheme: bearer
      description: Supplied by the host through the authorize hook (auth-security slice).
  parameters:
    fields:
      name: fields
      in: query
      schema:
        type: string
      description: Comma-separated fields to return. Unknown names are rejected.
  responses:
    Mutation:
      description: Result of a change
      content:
        application/json:
          schema:
            type: object
            properties:
              changed:
                type: boolean
              ref:
                $ref: "#/components/schemas/Ref"
              before:
                type: string
              after:
                type: string
              message:
                type: string
    Error:
      description: "Error. Codes: bad_request 400, unauthorized 401, forbidden 403, not_found 404, method_not_allowed 405, conflict 409, payload_too_large 413, unsupported_media_type 415, invalid 422, internal 500."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SessionItem:
      type: object
      required:
        - id
        - title
        - project
        - state
        - reason
        - pinned
        - lastActivityAt
        - link
        - prs
      properties:
        id:
          type: string
        title:
          type: string
        project:
          type: string
          enum:
            - allyte
            - ftk
            - focus
            - f4
            - xerilium
            - other
        state:
          type: string
          enum:
            - running
            - waiting
            - stuck
            - done
            - pinned
            - idle
        reason:
          type: string
          enum:
            - question
            - permission
            - needs-user
            - blocked
            - error
            - cut-short
            - api-error
            - dead-turn
            - pr-merged
            - superseded
            - turn-open
            - idle
        pinned:
          type: boolean
        lastActivityAt:
          type: string
          format: date-time
        link:
          type: string
          description: claude://claude.ai/epitaxy/<id>
        prs:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              state:
                type: string
        ask:
          type: string
        scheduled:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
    Inventory:
      type: object
      required:
        - at
        - total
        - counts
        - needsYou
        - archive
        - sessions
      properties:
        at:
          type: string
          format: date-time
        total:
          type: integer
        counts:
          type: object
          properties:
            running:
              type: integer
            waiting:
              type: integer
            stuck:
              type: integer
            done:
              type: integer
            pinned:
              type: integer
            idle:
              type: integer
        needsYou:
          type: array
          items:
            $ref: "#/components/schemas/SessionItem"
        archive:
          type: array
          items:
            $ref: "#/components/schemas/SessionItem"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionItem"
    PriItem:
      type: object
      additionalProperties: false
      required:
        - text
        - status
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum:
            - todo
            - doing
            - blocked
            - done
    Pri:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - items
        - backlog
        - weekly
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,23}$
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
            - active
            - paused
            - blocked
            - done
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/PriItem"
        backlog:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PriItem"
        weekly:
          type: array
          maxItems: 12
          description: Weekly progress, newest first
          items:
            type: object
            additionalProperties: false
            required:
              - week
              - text
            properties:
              week:
                type: string
                pattern: ^\d{4}-W(0[1-9]|[1-4]\d|5[0-3])$
              text:
                type: string
                minLength: 1
                maxLength: 500
    PrRec:
      type: object
      required:
        - id
        - repo
        - number
        - url
        - agent
        - reason
        - state
        - at
      properties:
        id:
          type: string
          pattern: ^pp-[0-9a-f]{8}$
        repo:
          type: string
        number:
          type: integer
        url:
          type: string
        agent:
          type: string
        reason:
          type: string
        toRank:
          type: integer
        state:
          type: string
          enum:
            - open
            - accepted
            - edited
            - rejected
        at:
          type: string
          format: date-time
        decision:
          type: object
          properties:
            at:
              type: string
              format: date-time
            reason:
              type: string
            rank:
              type: integer
            note:
              type: string
    PrPriView:
      type: object
      required:
        - version
        - rev
        - items
      properties:
        changed:
          type: boolean
        version:
          type: integer
        rev:
          type: integer
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              rank:
                type: integer
              repo:
                type: string
              number:
                type: integer
              pr:
                type: integer
              url:
                type: string
              pinned:
                type: boolean
              note:
                type: string
              by:
                type: string
              at:
                type: string
              title:
                type: string
              author:
                type: string
              isDraft:
                type: boolean
              assignee:
                type: string
                nullable: true
              labels:
                type: array
                items:
                  type: string
              reviewDecision:
                type: string
                nullable: true
              checks:
                type: string
                enum:
                  - green
                  - red
                  - pending
              mergeable:
                type: string
              lastPushAt:
                type: string
              headSha:
                type: string
              state:
                type: string
                enum:
                  - open
                  - merged
                  - closed
              factsAt:
                type: string
              baseStack:
                type: array
                items:
                  type: string
                description: PR urls this PR merges after
              waitsOn:
                type: array
                items:
                  type: string
                description: baseStack urls not merged
              why:
                type: string
              michaelDecision:
                type: object
                properties:
                  state:
                    type: string
                  reason:
                    type: string
                  at:
                    type: string
              report:
                type: object
                description: Newest per-PR report record
              acks:
                type: array
                items:
                  type: object
                  properties:
                    thread:
                      type: string
                    note:
                      type: string
                    at:
                      type: string
              status:
                type: string
                enum:
                  - approve
                  - review
                  - decide
                  - unblock
        escalations:
          type: object
          nullable: true
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/PrRec"
    PrisFile:
      type: object
      required:
        - version
        - rev
        - pris
      properties:
        version:
          type: integer
        rev:
          type: integer
        updatedAt:
          type: string
          format: date-time
        seed:
          type: object
          properties:
            source:
              type: string
            at:
              type: string
            sha256:
              type: string
        pris:
          type: array
          items:
            $ref: "#/components/schemas/Pri"
    PrFacts:
      type: object
      required:
        - repo
        - number
        - url
        - headSha
        - specLines
        - live
        - at
      properties:
        repo:
          type: string
        number:
          type: integer
        url:
          type: string
        title:
          type: string
        headSha:
          type: string
        specLines:
          type: integer
          description: Lines changed in spec files (.xe/, spec.md, docs/*.md)
        labels:
          type: array
          items:
            type: string
        live:
          type: boolean
          description: Needs live validation
        reasons:
          type: array
          items:
            type: string
        draft:
          type: boolean
        at:
          type: string
          format: date-time
    PrBrief:
      type: object
      required:
        - repo
        - number
        - url
        - problem
        - solution
        - recommendation
        - evidence
        - askedAt
        - headSha
        - stale
      properties:
        repo:
          type: string
        number:
          type: integer
        url:
          type: string
        problem:
          type: string
        solution:
          type: string
        recommendation:
          type: string
        evidence:
          type: array
          items:
            type: string
        askedAt:
          type: string
        headSha:
          type: string
        by:
          type: string
        stale:
          type: boolean
    LiveItem:
      type: object
      required:
        - id
        - text
        - by
        - state
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        text:
          type: string
        by:
          type: string
        state:
          type: string
          enum:
            - open
            - passed
            - failed
            - needs-fix
            - fixed-pending-revalidation
            - blocked
        comment:
          type: string
        reason:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
          description: "Who made the last change: owner or an agent"
    LiveLane:
      type: object
      required:
        - state
        - rev
        - items
        - done
      properties:
        state:
          type: string
          enum:
            - idle
            - preparing
            - working
            - ready-for-michael
            - revalidating
        rev:
          type: integer
        active:
          type: object
          properties:
            repo:
              type: string
            number:
              type: integer
            url:
              type: string
            title:
              type: string
            state:
              type: string
              enum:
                - preparing
                - working
                - ready-for-michael
                - revalidating
            by:
              type: string
            claimedAt:
              type: string
            worktree:
              type: string
            serverUrl:
              type: string
            port:
              type: integer
            pid:
              type: integer
            headSha:
              type: string
            waitingOnLock:
              type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveItem"
        done:
          type: array
          items:
            type: object
            properties:
              repo:
                type: string
              number:
                type: integer
              url:
                type: string
              at:
                type: string
              reason:
                type: string
    ReportItem:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: Single line.
        link:
          type: string
          maxLength: 2000
          pattern: ^https://
    ReportInput:
      type: object
      additionalProperties: false
      required:
        - agent
        - project
      properties:
        agent:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,23}$
        project:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,23}$
        top:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ReportItem"
        asks:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - ask
              - link
              - by
            properties:
              id:
                type: string
                pattern: ^[a-z0-9][a-z0-9-]{0,23}$
                description: Unique in the report; the ask key is rp.<agent>.<project>.<id>
              ask:
                type: string
                minLength: 1
                maxLength: 200
              link:
                type: string
                maxLength: 2000
                pattern: ^https://
              by:
                type: string
                description: ISO date or date-time deadline
              kind:
                type: string
                enum:
                  - approve
                  - review
                  - go-do
                  - answer
                default: answer
              recommend:
                type: string
                maxLength: 200
              why:
                type: string
                maxLength: 500
              default:
                type: string
                maxLength: 200
              priority:
                type: string
                enum:
                  - crit
                  - high
                  - normal
                  - low
        blockers:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ReportItem"
        progress:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ReportItem"
    CaptureResult:
      type: object
      properties:
        changed:
          type: boolean
        ref:
          $ref: "#/components/schemas/Ref"
        after:
          type: string
        spec:
          type: object
          properties:
            title:
              type: string
            due:
              type: string
              format: date
            effort:
              type: object
              properties:
                minutes:
                  type: integer
                emoji:
                  type: string
            project:
              type: string
            recurrence:
              type: object
              description: "offsetMonths is parsed and reported but not used by rolls: Quarterly-EOM+1 rolls to month end 3 months on."
              properties:
                cadence:
                  type: string
                  enum:
                    - daily
                    - weekly
                    - monthly
                    - quarterly
                    - yearly
                weekdays:
                  type: array
                  items:
                    type: string
                    enum:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                      - sat
                      - sun
                anchor:
                  type: string
                  enum:
                    - end-of-month
                offsetDays:
                  type: integer
                offsetMonths:
                  type: integer
                nominalDay:
                  type: string
                  format: date
    Ref:
      type: string
      pattern: ^(?![Rr][Ee][Aa][Dd][Mm][Ee]:)([^/\\:\0.][^/\\:\0]*):(\d{1,9})$
      example: alpha:12
      description: "`<project>:<line>`. README (any case) is reserved and never a valid project."
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - conflict
                - payload_too_large
                - unsupported_media_type
                - invalid
                - internal
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    InboxEntry:
      type: object
      description: One owner message in tasks/inbox/<project>.md. Agents act on open entries, then mark them handled.
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        project:
          type: string
        ref:
          $ref: "#/components/schemas/Ref"
        task:
          type: string
        parent:
          type: string
          description: Title of the parent row; absent for top-level rows
        kind:
          type: string
          enum:
            - reply
            - decision
            - instruction
        to:
          type: string
          enum:
            - agent
            - human
            - none
        text:
          type: string
        state:
          type: string
          enum:
            - open
            - handled
        handled:
          type: string
        note:
          type: string
        row:
          $ref: "#/components/schemas/Ref"
          description: Where the row is now, found by title (lines move); absent when the row is gone
    Ask:
      type: object
      description: One ask for the owner (tasks/asks/<key>.md) with its computed score and rank.
      properties:
        key:
          type: string
        state:
          type: string
          enum:
            - open
            - answered
            - done
        ask:
          type: string
        kind:
          type: string
          enum:
            - approve
            - decide
            - review
            - go-do
            - answer
        from:
          type: string
        project:
          type: string
        why:
          type: string
        recommend:
          type: string
        options:
          type: array
          items:
            type: string
        default:
          type: string
        by:
          type: string
          format: date-time
        reversible:
          type: boolean
        link:
          type: string
          format: uri
        priority:
          type: string
          enum:
            - crit
            - high
            - normal
            - low
        effort:
          type: string
        blocks:
          type: integer
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        answer:
          type: string
          enum:
            - go
            - no
            - option
            - reply
            - ask
            - done
            - defer
            - retract
        text:
          type: string
        answered:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
            - handled
            - resolved
            - defaulted
            - reopen
        handled:
          type: string
        note:
          type: string
        snoozed:
          type: string
          format: date-time
        detail:
          type: string
        score:
          type: integer
        rank:
          type: integer
        overdue:
          type: boolean
        snoozedUntil:
          type: string
          format: date-time
        agentReply:
          type: string
        flow:
          type: string
        seq:
          type: integer
        ref:
          $ref: "#/components/schemas/Ref"
        apply:
          type: string
        applies:
          type: array
          items:
            type: string
        flowTotal:
          type: integer
        flowDone:
          type: integer
        refText:
          type: string
        writer:
          type: string
          description: Who created the ask; only that token or the owner updates it
        row:
          $ref: "#/components/schemas/Ref"
        task:
          type: string
    TeamAgent:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        role:
          type: string
        scope:
          type: array
          items:
            type: string
        model:
          type: string
        tools:
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
            - long-running
            - ad-hoc
        prompt:
          type: string
        defined:
          type: boolean
        projects:
          type: array
          items:
            type: string
        reportsTo:
          type: string
          description: Slug of the agent this one reports to; absent on the roll-up
        icon:
          type: string
          description: "Avatar: an emoji, fluent:<name> (a Fluent Emoji file name), or a same-origin image path; absent means a monogram"
        source:
          type: string
          enum:
            - stack
            - claude
            - metadata
          description: tasks/agents file, .claude/agents file, or a project Agents line
    ThreadItem:
      type: object
      properties:
        at:
          type: string
        kind:
          type: string
          enum:
            - owner
            - agent
            - ask
            - review
            - subtask
        id:
          type: string
        text:
          type: string
        state:
          type: string
        agent:
          type: string
        withdrawn:
          type: boolean
          description: Owner item the owner took back (Undo); clients hide it
        ask:
          $ref: "#/components/schemas/Ask"
        verdict:
          type: string
        plan:
          type: string
        estimate:
          type: string
        ref:
          $ref: "#/components/schemas/Ref"
        done:
          type: boolean
    Review:
      type: object
      properties:
        ref:
          $ref: "#/components/schemas/Ref"
        at:
          type: string
        verdict:
          type: string
          enum:
            - can
            - partial
            - cannot
        plan:
          type: string
        estimate:
          type: string
        agent:
          type: string
        needs:
          type: array
          items:
            type: string
    Session:
      type: object
      description: One Claude session on this machine (from the local session store), with its state and cost.
      properties:
        id:
          type: string
        title:
          type: string
        project:
          type: string
        owner:
          type: string
          nullable: true
          description: The Stack project that owns the repo (name, alias, Repository, or Repos line), or null
        cwd:
          type: string
        branch:
          type: string
        lastActive:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - needs-you
            - running
            - active
            - idle
            - stale
        cost:
          type: object
          properties:
            usd:
              type: number
            tokens:
              type: integer
            approx:
              type: boolean
        prs:
          type: array
          items:
            type: string
    AgentItem:
      type: object
      properties:
        ref:
          $ref: "#/components/schemas/Ref"
        project:
          type: string
        title:
          type: string
        text:
          type: string
        state:
          type: string
          enum:
            - failing
            - waiting
            - review
            - merged
            - ci
            - working
            - queued
        prs:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              repo:
                type: string
              number:
                type: integer
              state:
                type: string
                enum:
                  - open
                  - draft
                  - merged
                  - closed
              checks:
                type: string
                enum:
                  - passing
                  - failing
                  - pending
                  - none
              title:
                type: string
              updatedAt:
                type: string
              priority:
                type: integer
                nullable: true
                description: Rank in the PR priority queue, or null
        last:
          type: object
          properties:
            at:
              type: string
            action:
              type: string
            outcome:
              type: string
            summary:
              type: string
        waitingOn:
          $ref: "#/components/schemas/Ref"
        replies:
          type: integer
        since:
          type: string
    NextTask:
      type: object
      properties:
        ref:
          $ref: "#/components/schemas/Ref"
        text:
          type: string
        project:
          type: string
        score:
          type: number
    Task:
      type: object
      description: Default fields are ref, text, project, section, done. depth and notes only via fields.
      properties:
        ref:
          $ref: "#/components/schemas/Ref"
        text:
          type: string
        project:
          type: string
        section:
          type: string
        done:
          type: boolean
        depth:
          type: integer
        notes:
          type: array
          items:
            type: string
    Project:
      type: object
      description: Default fields are name, title, open, done.
      properties:
        name:
          type: string
        title:
          type: string
        open:
          type: integer
        done:
          type: integer
        aliases:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        sections:
          type: array
          items:
            type: object
            properties:
              heading:
                type: string
              open:
                type: integer
              done:
                type: integer
