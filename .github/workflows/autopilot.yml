# @req FR:autopilot/triggers.events @req FR:autopilot/triggers.sweep @req FR:autopilot/safety.base
# Squash-merges a PR the owner opted in (Status: 🤖 Autopilot) once every gate holds on its current head.
# Decisions live in .github/scripts/autopilot-core.cjs; this file fetches state and applies the result.
name: Autopilot
on:
  # pull_request_target runs THIS file from the default branch, so a PR cannot edit its own gates.
  # Nothing below checks out or runs PR code.
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled]
  # Only the Finalized certification comment is worth a run.
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI, E2E]
    types: [completed]
  # Resolving a thread starts no workflow, and a review event would run the PR's own copy of this file.
  # The sweep catches both within 10 minutes.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (blank sweeps every Autopilot PR)
        required: false
# @req FR:autopilot/safety.perms: read-only at the top; the one job adds its write scopes below.
permissions:
  contents: read
jobs:
  reconcile:
    name: Reconcile Autopilot
    runs-on: ubuntu-latest
    # Job level on purpose: a run the `if:` below skips never enters the group, so it cannot replace a pending real run.
    # @req FR:autopilot/triggers.serial: one run per PR at a time, and a merge is never cancelled.
    concurrency:
      group: autopilot-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr || 'sweep' }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    if: >
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && startsWith(github.event.comment.body, '<!-- stack:finalized-head-sha -->') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0] != null) &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'Status: '))
    steps:
      # @req FR:autopilot/safety.pinned: every action below is pinned to a commit SHA.
      # @req FR:autopilot/triggers.self: only GITHUB_TOKEN writes labels, so those writes start no further run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const path = require('path');
            const { run } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/autopilot-run.cjs'));
            await run({ github, context, core });
