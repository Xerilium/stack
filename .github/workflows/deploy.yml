name: Deploy
# Deploys the web app and managed Functions to Azure Static Web Apps on push to main.
# The owner must add the repo secret AZURE_STATIC_WEB_APPS_API_TOKEN first (docs/runbook.md).
# Without it, or without web/package.json, the job builds nothing and exits green.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: gate
        run: |
          if [ -n "$SWA_TOKEN" ] && [ -f web/package.json ]; then echo "has_token=true" >> "$GITHUB_OUTPUT"; else echo "has_token=false" >> "$GITHUB_OUTPUT"; fi
      - name: Skip notice
        if: steps.gate.outputs.has_token != 'true'
        run: echo "Skipping deploy - AZURE_STATIC_WEB_APPS_API_TOKEN is not set or web/package.json is missing."
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.has_token == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.has_token == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Build
        if: steps.gate.outputs.has_token == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter ./web run build
      - name: Stage Functions
        if: steps.gate.outputs.has_token == 'true'
        run: |
          # host/dist was built by `pnpm build`; stage it with production dependencies only.
          mkdir -p api
          cp -r host/dist api/dist
          cp host/package.json host/host.json api/
          (cd api && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
          [ -f web/dist/staticwebapp.config.json ] || cp staticwebapp.config.json web/dist/
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        if: steps.gate.outputs.has_token == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          api_location: api
          skip_app_build: true
          skip_api_build: true
