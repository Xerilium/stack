            - generic [ref=e8512]: "> Prompt: Add a new update-repeated-tasks feature that adds preprocessing for tasks with the 🔁 emoji. This feature should run as part of the update-metadata feature. When update-repeated-tasks runs, it looks for all tasks marked with 🔁 that have been completed and creates a full copy of the task and places it at the the top of the Up next section with a start date of the next occurrence, defined by a string recurrence period. The recurrence period is specified as a string after the 🔁 emoji (e.g., \"🔁 {recurrence-period}: \"). Recurrence period options are: \"Daily\" (everyday based on time block), \"Weekdays\", 3-letter day of the week (e.g., \"Mon\", \"Tue\"), a specific day of the month (e.g., \"1\", \"15\"), or \"EOM\" for the last day of the month. If a day is used that is beyond the month (e.g., 31 in February), the last day of the month will be used. An optional exclamation point (\"!\") can be used after the recurrence period to indicate that the new task should be due on the recurrence period rather than started. So \"🔁 Mon: \" means the new task will be created with \"\" and \"🔁 Mon!: \" will use \"📅 Jan 1: \". Copied tasks must not be marked as complete. They should include all state except the previous start/due dates."
